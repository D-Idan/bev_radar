# Default configurations to run (when no specific configs are requested)
default_configurations:
  - baseline_tracking
  - distance_only
  - adaptive_assoc_squared
  - adaptive_assoc_stepped
#  - # experimental_high_confidence

# Baseline is raw predictions (not a tracking configuration)
baseline_config: "raw_predictions"