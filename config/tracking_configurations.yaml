  - no_confidence_distance
  - high_confidence_mahalanobis
  - constant_dt_mahalanobis
  - variable_dt_mahalanobis
  - adaptive_r_association
  - adaptive_r_full

# Baseline is raw predictions (not a tracking configuration)
baseline_config: "raw_predictions"