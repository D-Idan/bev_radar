# Tracking Configuration Variations
# Baseline is the raw network predictions (no tracking)
# Each configuration defines overrides to apply to the base tracker config

configurations:
  # Core algorithm comparison (cars only)
  mahalanobis_baseline:
    description: "Mahalanobis distance strategy baseline"
    overrides:
      strategy: "mahalanobis_distance"
      min_confidence_init: 0.5
      min_confidence_assoc: 0.2
      use_adaptive_r_in_association: false
      use_adaptive_r_in_update: false

  distance_only_baseline:
    description: "Distance-only strategy baseline"
    overrides:
      strategy: "distance_only"
      min_confidence_init: 0.5
      min_confidence_assoc: 0.2
      use_adaptive_r_in_association: false
      use_adaptive_r_in_update: false

  # Confidence threshold experiments
  no_confidence_mahalanobis:
    description: "Mahalanobis with no confidence filtering"
    overrides:
      strategy: "mahalanobis_distance"
      min_confidence_init: 0.0
      min_confidence_assoc: 0.0
      strict_confidence_for_tentative_tracks: false
      use_adaptive_r_in_association: false
      use_adaptive_r_in_update: false

  no_confidence_distance:
    description: "Distance-only with no confidence filtering"
    overrides:
      strategy: "distance_only"
      min_confidence_init: 0.0
      min_confidence_assoc: 0.0
      strict_confidence_for_tentative_tracks: false
      use_adaptive_r_in_association: false
      use_adaptive_r_in_update: false

  high_confidence_mahalanobis:
    description: "Mahalanobis with high confidence thresholds"
    overrides:
      strategy: "mahalanobis_distance"
      min_confidence_init: 0.8
      min_confidence_assoc: 0.6
      strict_confidence_for_tentative_tracks: true
      use_adaptive_r_in_association: false
      use_adaptive_r_in_update: false

  # Timing comparison
  constant_dt_mahalanobis:
    description: "Mahalanobis with constant delta_t"
    overrides:
      strategy: "mahalanobis_distance"
      min_confidence_init: 0.5
      min_confidence_assoc: 0.2
      use_constant_dt: true
      use_adaptive_r_in_association: false
      use_adaptive_r_in_update: false

  variable_dt_mahalanobis:
    description: "Mahalanobis with variable delta_t"
    overrides:
      strategy: "mahalanobis_distance"
      min_confidence_init: 0.5
      min_confidence_assoc: 0.2
      use_constant_dt: false
      use_adaptive_r_in_association: false
      use_adaptive_r_in_update: false

  # Adaptive R experiments
  adaptive_r_association:
    description: "Adaptive R in association only"
    overrides:
      strategy: "mahalanobis_distance"
      min_confidence_init: 0.5
      min_confidence_assoc: 0.2
      use_adaptive_r_in_association: true
      use_adaptive_r_in_update: false
      r_weighting_strategy: "linear"
      r_min_factor: 0.5
      r_max_factor: 10.0

  adaptive_r_full:
    description: "Adaptive R in both association and update"
    overrides:
      strategy: "mahalanobis_distance"
      min_confidence_init: 0.5
      min_confidence_assoc: 0.2
      use_adaptive_r_in_association: true
      use_adaptive_r_in_update: true
      r_weighting_strategy: "linear"
      r_min_factor: 0.5
      r_max_factor: 10.0

