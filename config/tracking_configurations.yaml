# Tracking Configuration Variations
# Baseline is the raw network predictions (no tracking)
# Each configuration defines overrides to apply to the base tracker config

configurations:
  baseline_tracking:
    description: "Basic tracking configuration"
    overrides:
      use_adaptive_r_in_association: false
      use_adaptive_r_in_update: false
      min_confidence_init: 0.8  # Minimum confidence to create new tracks
      min_confidence_assoc: 0.5  # Minimum confidence for detection-track association

#  adaptive_assoc_squared:
#    description: "Adaptive R in association with squared weighting"
#    overrides:
#      use_adaptive_r_in_association: true
#      use_adaptive_r_in_update: false
#      r_weighting_strategy: "squared"
#      min_confidence_init: 0.8  # Minimum confidence to create new tracks
#      min_confidence_assoc: 0.5  # Minimum confidence for detection-track association
#      r_max_factor: 10000

  distance_only:
    description: "Adaptive R in association with squared weighting"
    overrides:
      strategy: "distance_only"



  adaptive_assoc_linear:
    description: "Adaptive R in association with linear weighting"
    overrides:
      use_adaptive_r_in_association: true
      use_adaptive_r_in_update: false
      r_weighting_strategy: "linear"
      r_min_factor: 0.5
      r_max_factor: 10
      process_noise_q_std: 1.0
      measurement_noise_std: 0.9
      initial_pos_std: 4.0
      initial_vel_std: 2.0
      min_hits: 3

