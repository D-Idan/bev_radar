#  # Example of additional custom configuration
#  experimental_high_confidence:
#    description: "Experimental configuration favoring high confidence detections"
#    overrides:
#      use_adaptive_r_in_association: true
#      use_adaptive_r_in_update: true
#      r_weighting_strategy: "stepped"
#      min_confidence_init: 0.7
#      min_confidence_assoc: 0.4
#      confidence_weight: 0.5

  adaptive_assoc_linear:
    description: "Adaptive R in association with linear weighting"
    overrides:
      create_video: false
      use_adaptive_r_in_association: true
      use_adaptive_r_in_update: false
      r_weighting_strategy: "linear"
      r_min_factor: 0.5
      r_max_factor: 10
      process_noise_q_std: 1.0
      measurement_noise_std: 0.9
      initial_pos_std: 4.0
      initial_vel_std: 2.0
      min_hits: 3

# Default configurations to run (when no specific configs are requested)
default_configurations:
#  - baseline_tracking
#  - distance_only
#  - adaptive_assoc_squared
#  - adaptive_assoc_stepped
#  - adaptive_assoc_linear
  - mahalanobis_baseline
  - distance_only_baseline
  - no_confidence_mahalanobis
  - no_confidence_distance
  - high_confidence_mahalanobis
  - constant_dt_mahalanobis
  - variable_dt_mahalanobis
  - adaptive_r_association
  - adaptive_r_full
  - mahalanobis_low_noise
  - adaptive_r_full_tight
  - high_confidence_relaxed
  - hybrid_low_noise_relaxed
  - hybrid_enhanced

# Baseline is raw predictions (not a tracking configuration)
baseline_config: "raw_predictions"