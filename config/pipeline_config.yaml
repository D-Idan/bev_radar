# =============================================================================
# RADAR PROCESSING PIPELINE CONFIGURATION
# =============================================================================


# =============================================================================
# TRACKING CONFIGURATION
# =============================================================================
tracking:
  # Processing options
  create_video: false # Create video output
  max_video_samples: null  # null = no limit, integer = limit samples
  max_frames: null  # null = all frames, integer = limit for debugging
  save_visualizations: false  # Global control for all visualizations

  # Poor performance analysis (requires save_visualizations: true to run)
  poor_performance_analysis:
    enable: true  # Enable/disable poor performance analysis
    metrics_to_analyze: ['hota', 'mota', 'det_a', 'precision', 'tracking_iou', 'camera_iou_mean'] # Primary metrics to analyze
    top_k_worst_frames: 20  # Number of worst frames to identify per metric

  # Track lifecycle parameters
  lifecycle:
    max_age: 3  # Max frames without detection before track deletion
    min_hits: 3  # Min detections required for track confirmation
    max_velocity_ms: 69.4 # 250 km/h = 69.4 m/s  # 300 km/h = 83.3 m/s - max expected object velocity

  # Timing parameters
  timing:
    base_dt: 0.2  # 200ms base time step
    max_dt_gap: 0.3  # Trigger multi-step prediction for gaps > 0.3s
    max_time_without_update: 2.0  # Kill tracks after 1 second without update
    max_frame_gap_time: 4.0  # Kill all tracks if frame gap > 4 seconds
    use_constant_dt: false  # If true, always use base_dt regardless of actual time gaps

  # Association strategy and confidence parameters
  association:
    strategy: "mahalanobis_distance"  # "distance_only", "confidence_weighted", "confidence_gated", "hybrid_score", "mahalanobis_distance"
    min_confidence_init: 0.5  # Minimum confidence to create new tracks
    min_confidence_assoc: 0.2  # Minimum confidence for detection-track association
    confidence_weight: 0.3  # Weight factor for confidence in hybrid strategies
    strict_confidence_for_tentative_tracks: true  # Apply min_confidence_init to tentative track updates

  # Adaptive R matrix configuration
  adaptive_r:
    use_in_association: false  # Control Mahalanobis distance calculation
    use_in_update: false  # Control Kalman filter update
    weighting_strategy: "linear"  # "squared", "linear", "stepped"
    config:
      r_min_factor: 0.7  # High confidence: 70% of base R
      r_max_factor: 15.0  # Low confidence: 15x base R
      stepped_r_thresholds: [0.9, 0.8, 0.7, 0.5]
      stepped_r_factors: [0.7, 0.8, 1.0, 1.5, 2.0, 3.0]

  # Mahalanobis distance parameters
  mahalanobis:
    default_chi2_threshold: 5.991  # 90% confidence (4.605), 95% (5.991), 99% (6.635)

  # Range culling parameters
  range_culling:
    enable: true
    range_buffer: 10.0  # meters
    azimuth_buffer_deg: 5.0  # degrees

  # Kalman filter parameters
  kalman:
    process_noise_q_std: 1.5
    measurement_noise_std: 1.5
    initial_pos_std: 4.0
    initial_vel_std: 2.0

  # Ego motion compensation
  ego_motion:
    ego_motion_enable: false
    radar_position:
      lateral_offset: 0.0    # meters, positive = right side
      longitudinal_offset: -3.0  # meters, positive = forward

  # Evaluation parameters
  evaluation:
    max_distance_threshold: 10.0  # Distance threshold for valid associations in evaluation (meters) default: 2.0
    iou_thresholds: [0.3, 0.5]  # IoU thresholds for evaluation
    use_cvpr_labels_only: true  # Use only CVPR updated labels for range-azimuth evaluation (PRECISION ONLY)
    use_camera_fov_filter: true  # Filter detections/tracks to camera FOV during evaluation
    iou_thresholds: [0.3, 0.5]  # List of IoU thresholds for evaluation metrics
    # Note: Camera has ~56.3° horizontal FOV but is positioned 1.384m behind radar,
    # so effective FOV at radar position varies with range (closer objects have narrower effective FOV)

# =============================================================================
# CONFIGURATION FILES
# =============================================================================
config_files:
  radar_model_config: "config/radar_model_config.yaml"

# =============================================================================
# PATH CONFIGURATION
# =============================================================================
paths:
  # Input data paths
  data_dir: "/Volumes/ELEMENTS/datasets/radial"
  calibration_table: "/Volumes/ELEMENTS/datasets/radial/CalibrationTable.npy"
  labels_path: "/Volumes/ELEMENTS/datasets/radial/labels_CVPR.csv"

  # Model path
  model_path: "/Volumes/ELEMENTS/datasets/Trained_Models/RADIal_SwinTransformer_ADC.pth"

  # Output paths
  output_base: "/Volumes/ELEMENTS/datasets/radial/RadIal_Data"

