# =============================================================================
# RADAR SYSTEM CONFIGURATION
# =============================================================================
radar:
  # Data processing method
  method: "ADC"

  # Radar geometry and resolution
  geometry:
    ranges: [512, 896, 1]
    resolution: [0.201171875, 0.2]
    size: 3

  # Statistics for normalization
  statistics:
    input_mean: []
    input_std: []
    reg_mean: [0.4048094369863972, 0.3997392847799934]
    reg_std: [0.6968599580482511, 0.6942950877813826]

  # Radar coverage parameters
  coverage:
    max_range: 103.0  # meters
    min_azimuth_deg: -90.0
    max_azimuth_deg: 90.0

# =============================================================================
# MODEL CONFIGURATION
# =============================================================================
model:
  name: "SwinTransformer_ADC_LinearActivation"
  data_mode: "ADC"

  # Architecture parameters
  depths: [2, 2, 6, 2]
  channels: [32, 40, 48, 56]
  patch_size: 2
  in_chans: 32
  embed_dim: 48
  drop_rates: [0.0, 0.0, 0.0]
  num_heads: [3, 6, 12, 24]
  detection_head: true
  segmentation_head: true